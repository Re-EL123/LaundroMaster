<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline · LaundroMaster</title>
<meta name="theme-color" content="#0ea5e9">
  <script>(function(){try{var t=localStorage.getItem('lm_theme');if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#0B0B0D':'#D90429');}catch(e){}})();</script>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f1f5f9; color: #0f172a; padding: 24px;
  }
  .card {
    max-width: 420px; text-align: center; background: #fff; border-radius: 20px;
    padding: 40px 28px; box-shadow: 0 18px 50px rgba(15, 23, 42, .12);
  }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 1.35rem; margin: 18px 0 8px; }
  p { color: #475569; line-height: 1.5; margin: 0 0 22px; }
  button {
    appearance: none; border: 0; border-radius: 12px; padding: 12px 22px;
    background: #0ea5e9; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0b1220; color: #e2e8f0; }
    .card { background: #111827; box-shadow: none; }
    p { color: #94a3b8; }
  }
</style>
</head>
<body>
  <div class="card">
    <img src="shared/assets/app-icon.png" alt="LaundroMaster" onerror="this.style.display='none'">
    <h1>You're offline</h1>
    <p>LaundroMaster needs a connection for this page. Check your internet and try again — your saved pages still work.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>

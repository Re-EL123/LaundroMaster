<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D90429">
  <link rel="icon" href="../../../shared/assets/favicon-32.png?v=8">
  <link rel="apple-touch-icon" href="../../../shared/assets/apple-touch-icon.png?v=8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LaundroMaster">
  <link rel="manifest" href="../manifest.webmanifest">
  <title>Laundromat - LaundroMaster</title>
  <link rel="stylesheet" href="../../../shared/css/tokens.css?v=6">
  <link rel="stylesheet" href="../../../shared/css/reset.css?v=6">
  <link rel="stylesheet" href="../../../shared/css/layout.css?v=6">
  <link rel="stylesheet" href="../../../shared/css/buttons.css?v=6">
  <link rel="stylesheet" href="../../../shared/css/cards.css?v=6">
  <link rel="stylesheet" href="../../../shared/css/forms.css?v=6">
  <link rel="stylesheet" href="../../../shared/css/utilities.css?v=6">
  <link rel="stylesheet" href="../../../shared/css/motion.css?v=6">
  <link rel="stylesheet" href="../css/customer.css?v=6">
</head>
<body>
  <header class="app-header" id="appHeader"></header>
  <main class="page-shell" style="padding: var(--space-6) 0;">
    <div id="biz"></div>
    <div class="section-head mt-6">
      <h2>Services</h2>
      <span class="text-sm text-muted" id="selectionTotal"></span>
    </div>
    <div class="card-grid" id="svcs"></div>
    <div class="mt-6 flex">
      <button class="btn btn-primary" id="continueBtn" disabled>Continue to booking</button>
      <button class="btn btn-secondary" id="favBtn" hidden>Save to favorites</button>
    </div>

    <div class="section-head mt-6"><h2>Reviews</h2></div>
    <div id="reviews"></div>

    <div class="card mt-6" id="reviewFormCard" hidden>
      <div class="card-body">
        <h3 class="card-title">Leave a review</h3>
        <form id="reviewForm" class="grid">
          <div class="field">
            <label class="label" for="rating">Rating</label>
            <select class="select" id="rating" name="rating">
              <option value="5">5 - Excellent</option>
              <option value="4">4 - Good</option>
              <option value="3">3 - Okay</option>
              <option value="2">2 - Poor</option>
              <option value="1">1 - Bad</option>
            </select>
          </div>
          <div class="field">
            <label class="label" for="review_text">Comment</label>
            <textarea class="textarea" id="review_text" name="review_text" rows="3"></textarea>
          </div>
          <div class="field">
            <label class="label">Photos (optional, up to 6)</label>
            <div class="gallery" id="reviewGallery">
              <button type="button" class="gallery-add" id="reviewAddPhoto" aria-label="Add photo">+</button>
            </div>
            <input type="file" id="reviewPhotoInput" accept="image/*" hidden>
          </div>
          <button class="btn btn-primary" type="submit">Submit review</button>
          <p class="form-msg text-sm" id="reviewMsg" role="status"></p>
        </form>
      </div>
    </div>
  </main>
  <script src="../js/config.js?v=6"></script>
  <script type="module" src="../js/laundromat.js?v=6"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D90429">
  <script>(function(){try{var t=localStorage.getItem('lm_theme');if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#0B0B0D':'#D90429');}catch(e){}})();</script>
  <link rel="icon" href="../../../shared/assets/favicon-32.png?v=11">
  <link rel="apple-touch-icon" href="../../../shared/assets/apple-touch-icon.png?v=11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LaundroMaster">
  <link rel="manifest" href="../manifest.webmanifest">
  <title>Discover - LaundroMaster</title>
  <link rel="stylesheet" href="../../../shared/css/tokens.css?v=11">
  <link rel="stylesheet" href="../../../shared/css/reset.css?v=11">
  <link rel="stylesheet" href="../../../shared/css/layout.css?v=11">
  <link rel="stylesheet" href="../../../shared/css/buttons.css?v=11">
  <link rel="stylesheet" href="../../../shared/css/cards.css?v=11">
  <link rel="stylesheet" href="../../../shared/css/forms.css?v=11">
  <link rel="stylesheet" href="../../../shared/css/utilities.css?v=11">
  <link rel="stylesheet" href="../../../shared/css/motion.css?v=11">
  <link rel="stylesheet" href="../css/customer.css?v=11">
</head>
<body>
  <header class="app-header" id="appHeader"></header>
  <main class="page-shell" style="padding: var(--space-6) 0;">
    <h1 class="page-title">Discover</h1>
    <form class="toolbar" id="searchForm">
      <div class="field" style="flex:1; min-width:220px;">
        <label class="label" for="q">Search</label>
        <input class="input" id="q" name="q" type="search" placeholder="Suburb, name or service">
      </div>
      <div class="field">
        <label class="label" for="min_rating">Min rating</label>
        <select class="select" id="min_rating">
          <option value="">Any</option>
          <option value="4">4★ &amp; up</option>
          <option value="3">3★ &amp; up</option>
        </select>
      </div>
      <div class="field">
        <label class="label" for="max_price">Max price</label>
        <input class="input" id="max_price" type="number" min="0" step="10" placeholder="e.g. 80">
      </div>
      <button class="btn btn-primary" type="submit">Search</button>
      <button class="btn btn-secondary" type="button" id="nearBtn">Near me</button>
    </form>
    <div class="filter-bar" id="sortBar" role="group" aria-label="Sort results">
      <button class="chip is-active" data-sort="featured" type="button">Recommended</button>
      <button class="chip" data-sort="rating" type="button">Top rated</button>
      <button class="chip" data-sort="newest" type="button">Newest</button>
      <span class="text-sm text-muted" id="resultCount" style="margin-left:auto"></span>
    </div>
    <div class="card-grid mt-4" id="list"></div>
  </main>
  <script src="../js/config.js?v=11"></script>
  <script type="module" src="../js/discover.js?v=11"></script>
</body>
</html>

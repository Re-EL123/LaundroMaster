<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover - LaundroMaster</title>
  <link rel="stylesheet" href="../../../shared/css/tokens.css?v=4">
  <link rel="stylesheet" href="../../../shared/css/reset.css?v=4">
  <link rel="stylesheet" href="../../../shared/css/layout.css?v=4">
  <link rel="stylesheet" href="../../../shared/css/buttons.css?v=4">
  <link rel="stylesheet" href="../../../shared/css/cards.css?v=4">
  <link rel="stylesheet" href="../../../shared/css/forms.css?v=4">
  <link rel="stylesheet" href="../../../shared/css/utilities.css?v=4">
  <link rel="stylesheet" href="../../../shared/css/motion.css?v=4">
  <link rel="stylesheet" href="../css/customer.css?v=4">
</head>
<body>
  <header class="app-header" id="appHeader"></header>
  <main class="page-shell" style="padding: var(--space-6) 0;">
    <h1 class="page-title">Discover</h1>
    <form class="toolbar" id="searchForm">
      <div class="field" style="flex:1; min-width:220px;">
        <label class="label" for="q">Search</label>
        <input class="input" id="q" name="q" type="search" placeholder="Suburb, name or service">
      </div>
      <button class="btn btn-primary" type="submit">Search</button>
      <button class="btn btn-secondary" type="button" id="nearBtn">Near me</button>
    </form>
    <div class="card-grid" id="list"></div>
  </main>
  <script src="../js/config.js?v=4"></script>
  <script type="module" src="../js/discover.js?v=4"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D90429">
  <link rel="icon" href="../../../shared/assets/favicon-32.png?v=8">
  <link rel="apple-touch-icon" href="../../../shared/assets/apple-touch-icon.png?v=8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LaundroMaster">
  <link rel="manifest" href="../manifest.webmanifest">
  <title>Profile - LaundroMaster</title>
  <link rel="stylesheet" href="../../../shared/css/tokens.css?v=8">
  <link rel="stylesheet" href="../../../shared/css/reset.css?v=8">
  <link rel="stylesheet" href="../../../shared/css/layout.css?v=8">
  <link rel="stylesheet" href="../../../shared/css/buttons.css?v=8">
  <link rel="stylesheet" href="../../../shared/css/cards.css?v=8">
  <link rel="stylesheet" href="../../../shared/css/forms.css?v=8">
  <link rel="stylesheet" href="../../../shared/css/utilities.css?v=8">
  <link rel="stylesheet" href="../../../shared/css/motion.css?v=8">
  <link rel="stylesheet" href="../css/customer.css?v=8">
</head>
<body>
  <header class="app-header" id="appHeader"></header>
  <main class="page-shell" style="padding: var(--space-6) 0;">
    <h1 class="page-title">Profile</h1>
    <div class="layout-split grid">
      <form class="card" id="profileForm">
        <div class="card-body">
          <div class="profile-avatar">
            <img id="avatarPreview" class="avatar" alt="" src="">
            <button type="button" class="btn btn-secondary" id="avatarBtn">Change photo</button>
            <input type="file" id="avatarInput" accept="image/*" hidden>
          </div>
          <div class="field">
            <label class="label" for="full_name">Full name</label>
            <input class="input" id="full_name" name="full_name" autocomplete="name">
          </div>
          <div class="field">
            <label class="label" for="email">Email</label>
            <input class="input" id="email" disabled>
          </div>
          <div class="field">
            <label class="label" for="phone">Phone</label>
            <input class="input" id="phone" name="phone" autocomplete="tel">
          </div>
          <button class="btn btn-primary" type="submit" id="saveBtn">Save changes</button>
          <p class="form-msg" id="msg" role="status" aria-live="polite"></p>
        </div>
      </form>
      <aside class="card">
        <div class="card-body">
          <h2 class="card-title">Account</h2>
          <p class="text-sm">Signed in as <strong id="accountEmail"></strong></p>
          <p class="text-sm text-muted">Role: <span id="roleLabel"></span></p>
          <button class="btn btn-secondary" id="signOutBtn" type="button">Sign out</button>
        </div>
      </aside>
    </div>
    <div class="section-head mt-6"><h2>Your savings</h2></div>
    <div id="savingsCard"></div>
    <div class="section-head mt-6"><h2>LaundroMaster+</h2></div>
    <div id="plusCard"></div>
  </main>
  <script src="../js/config.js?v=8"></script>
  <script type="module" src="../js/profile.js?v=8"></script>
</body>
</html>

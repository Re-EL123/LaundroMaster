<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D90429">
  <script>(function(){try{var t=localStorage.getItem('lm_theme');if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#0B0B0D':'#D90429');}catch(e){}})();</script>
  <link rel="icon" href="../../../shared/assets/favicon-32.png?v=10">
  <link rel="apple-touch-icon" href="../../../shared/assets/apple-touch-icon.png?v=10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LaundroMaster">
  <link rel="manifest" href="../manifest.webmanifest">
  <title>Booking - LaundroMaster</title>
  <link rel="stylesheet" href="../../../shared/css/tokens.css?v=10">
  <link rel="stylesheet" href="../../../shared/css/reset.css?v=10">
  <link rel="stylesheet" href="../../../shared/css/layout.css?v=10">
  <link rel="stylesheet" href="../../../shared/css/buttons.css?v=10">
  <link rel="stylesheet" href="../../../shared/css/cards.css?v=10">
  <link rel="stylesheet" href="../../../shared/css/forms.css?v=10">
  <link rel="stylesheet" href="../../../shared/css/utilities.css?v=10">
  <link rel="stylesheet" href="../../../shared/css/motion.css?v=10">
  <link rel="stylesheet" href="../css/customer.css?v=10">
</head>
<body>
  <header class="app-header" id="appHeader"></header>
  <main class="page-shell" style="padding: var(--space-6) 0;">
    <h1 class="page-title">Complete your booking</h1>
    <div class="layout-split grid">
      <form id="frm" class="card">
        <div class="card-body">
          <div id="summary"><p class="text-muted">Loading your selection…</p></div>

          <fieldset class="grid">
            <legend>Collection &amp; delivery</legend>
            <label class="flex"><input type="checkbox" id="pickup_required" name="pickup_required"> Pickup required</label>
            <label class="flex"><input type="checkbox" id="delivery_required" name="delivery_required"> Delivery required</label>
            <div class="field" id="pickupAddressField" hidden>
              <label class="label" for="pickup_address">Pickup address</label>
              <input class="input" id="pickup_address" name="pickup_address" autocomplete="street-address">
            </div>
            <div class="field" id="deliveryAddressField" hidden>
              <label class="label" for="delivery_address">Delivery address</label>
              <input class="input" id="delivery_address" name="delivery_address" autocomplete="street-address">
            </div>
          </fieldset>

          <div class="field">
            <label class="label" for="scheduled_at">Preferred date &amp; time</label>
            <input class="input" id="scheduled_at" name="scheduled_at" type="datetime-local">
          </div>
          <div class="field">
            <label class="label" for="customer_notes">Notes</label>
            <textarea class="textarea" id="customer_notes" name="customer_notes" rows="3" placeholder="Anything we should know?"></textarea>
          </div>

          <button class="btn btn-primary" type="submit" id="submitBtn">Place booking</button>
          <p class="form-msg" id="msg" role="status" aria-live="polite"></p>
        </div>
      </form>

      <aside class="card">
        <div class="card-body">
          <h2 class="card-title">Order summary</h2>
          <div id="orderSummary"><p class="text-muted">No items selected.</p></div>
          <div id="plusUpsell"></div>
        </div>
      </aside>
    </div>
  </main>
  <script src="../js/config.js?v=10"></script>
  <script type="module" src="../js/booking.js?v=10"></script>
</body>
</html>

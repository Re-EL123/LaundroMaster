<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaundroMaster - Home</title>
  <meta name="description" content="Find and book nearby laundry services with LaundroMaster.">
  <link rel="stylesheet" href="../../shared/css/tokens.css?v=3">
  <link rel="stylesheet" href="../../shared/css/reset.css?v=3">
  <link rel="stylesheet" href="../../shared/css/layout.css?v=3">
  <link rel="stylesheet" href="../../shared/css/buttons.css?v=3">
  <link rel="stylesheet" href="../../shared/css/cards.css?v=3">
  <link rel="stylesheet" href="../../shared/css/forms.css?v=3">
  <link rel="stylesheet" href="../../shared/css/utilities.css?v=3">
  <link rel="stylesheet" href="../../shared/css/motion.css?v=3">
  <link rel="stylesheet" href="./css/customer.css?v=3">
  <link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
  <header class="app-header" id="appHeader"></header>
  <main class="page-shell" style="padding: var(--space-8) 0;">
    <section class="hero">
      <h1>Find nearby laundromats</h1>
      <p class="text-muted">Book collection and delivery in just a few steps.</p>
      <form class="search-bar" action="./pages/discover.html" method="get">
        <input class="input" type="search" name="q" placeholder="Search suburb or service" aria-label="Search">
        <button class="btn btn-primary" type="submit">Search</button>
      </form>
    </section>
    <section class="mt-6">
      <div class="section-head">
        <h2>Top rated</h2>
        <a href="./pages/discover.html" class="text-sm">Browse all</a>
      </div>
      <div class="card-grid" id="nearbyList"></div>
    </section>
  </main>
  <script src="./js/config.js?v=3"></script>
  <script type="module" src="./js/home.js?v=3"></script>
</body>
</html>

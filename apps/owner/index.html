<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Dashboard - LaundroMaster</title>
  <link rel="stylesheet" href="../../shared/css/tokens.css">
  <link rel="stylesheet" href="../../shared/css/reset.css">
  <link rel="stylesheet" href="../../shared/css/layout.css">
  <link rel="stylesheet" href="../../shared/css/buttons.css">
  <link rel="stylesheet" href="../../shared/css/cards.css">
  <link rel="stylesheet" href="../../shared/css/forms.css">
  <link rel="stylesheet" href="../../shared/css/utilities.css">
  <link rel="stylesheet" href="../../shared/css/motion.css">
  <link rel="stylesheet" href="./css/owner.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="index.html">LM Owner</a>
    <nav class="side-nav">
      <a href="index.html">Dashboard</a>
      <a href="pages/bookings.html">Bookings</a>
      <a href="pages/services.html">Services</a>
      <a href="pages/earnings.html">Earnings</a>
      <a href="pages/settings.html">Settings</a>
    </nav>
  </aside>
  <main class="main">
    <header class="topbar page-shell flex justify-between">
      <h1>Dashboard</h1>
      <div id="sessionMount" class="session-control"></div>
    </header>
    <div class="page-shell content">
      <div class="card-grid" id="stats">
        <article class="card"><div class="card-body"><h2 class="text-sm text-muted">Pending</h2><p class="stat-value">—</p></div></article>
        <article class="card"><div class="card-body"><h2 class="text-sm text-muted">Active</h2><p class="stat-value">—</p></div></article>
        <article class="card"><div class="card-body"><h2 class="text-sm text-muted">Completed</h2><p class="stat-value">—</p></div></article>
        <article class="card"><div class="card-body"><h2 class="text-sm text-muted">Revenue</h2><p class="stat-value">—</p></div></article>
      </div>
      <div class="section-head mt-6"><h2>Recent bookings</h2><a class="text-sm" href="pages/bookings.html">View all</a></div>
      <div class="card-grid" id="recent"></div>
    </div>
  </main>
  <script src="./js/config.js"></script>
  <script type="module" src="./js/dashboard.js"></script>
</body>
</html>

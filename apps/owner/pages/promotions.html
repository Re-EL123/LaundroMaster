<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Promotions - LaundroMaster</title>
  <link rel="stylesheet" href="../../../shared/css/tokens.css?v=5">
  <link rel="stylesheet" href="../../../shared/css/reset.css?v=5">
  <link rel="stylesheet" href="../../../shared/css/layout.css?v=5">
  <link rel="stylesheet" href="../../../shared/css/buttons.css?v=5">
  <link rel="stylesheet" href="../../../shared/css/cards.css?v=5">
  <link rel="stylesheet" href="../../../shared/css/forms.css?v=5">
  <link rel="stylesheet" href="../../../shared/css/utilities.css?v=5">
  <link rel="stylesheet" href="../../../shared/css/motion.css?v=5">
  <link rel="stylesheet" href="../css/owner.css?v=5">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="../index.html">LM Owner</a>
    <nav class="side-nav">
      <a href="../index.html">Dashboard</a>
      <a href="bookings.html">Bookings</a>
      <a href="services.html">Services</a>
      <a href="earnings.html">Earnings</a>
      <a href="payouts.html">Payouts</a>
      <a href="plan.html">Plan</a>
      <a href="promotions.html">Promotions</a>
      <a href="settings.html">Settings</a>
    </nav>
  </aside>
  <main class="main">
    <header class="topbar page-shell flex justify-between">
      <h1>Promotions</h1>
      <div class="flex"><div id="notifMount"></div><div id="sessionMount" class="session-control"></div></div>
    </header>
    <div class="page-shell content">
      <div class="section-head"><h2>Performance</h2></div>
      <div class="metric-grid" id="promoStats" style="margin-bottom:var(--space-6)"></div>
      <form class="card" id="promoForm" style="max-width:520px; margin-bottom:var(--space-6)">
        <div class="card-body">
          <h2 class="card-title">Feature a laundromat</h2>
          <p class="text-sm text-muted" id="priceNote">—</p>
          <div class="field">
            <label class="label" for="laundromat_id">Laundromat</label>
            <select class="input" id="laundromat_id" required></select>
          </div>
          <button class="btn btn-primary" type="submit" id="buyBtn">Purchase promotion</button>
        </div>
      </form>
      <div class="section-head"><h2>Your promotions</h2></div>
      <div class="card-grid" id="list"></div>
    </div>
  </main>
  <script src="../js/config.js?v=5"></script>
  <script type="module" src="../js/promotions.js?v=5"></script>
</body>
</html>

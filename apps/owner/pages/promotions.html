<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D90429">
  <script>(function(){try{var t=localStorage.getItem('lm_theme');if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#0B0B0D':'#D90429');}catch(e){}})();</script>
  <link rel="icon" href="../../../shared/assets/favicon-32.png?v=10">
  <link rel="apple-touch-icon" href="../../../shared/assets/apple-touch-icon.png?v=10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LaundroMaster">
  <link rel="manifest" href="../manifest.webmanifest">
  <title>Owner Promotions - LaundroMaster</title>
  <link rel="stylesheet" href="../../../shared/css/tokens.css?v=10">
  <link rel="stylesheet" href="../../../shared/css/reset.css?v=10">
  <link rel="stylesheet" href="../../../shared/css/layout.css?v=10">
  <link rel="stylesheet" href="../../../shared/css/buttons.css?v=10">
  <link rel="stylesheet" href="../../../shared/css/cards.css?v=10">
  <link rel="stylesheet" href="../../../shared/css/forms.css?v=10">
  <link rel="stylesheet" href="../../../shared/css/utilities.css?v=10">
  <link rel="stylesheet" href="../../../shared/css/motion.css?v=10">
  <link rel="stylesheet" href="../css/owner.css?v=10">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="../index.html"><img src="../../../shared/assets/app-icon.png?v=10" alt="" width="28" height="28">LM Owner</a>
    <nav class="side-nav">
      <a href="../index.html">Dashboard</a>
      <a href="bookings.html">Bookings</a>
      <a href="services.html">Services</a>
      <a href="earnings.html">Earnings</a>
      <a href="payouts.html">Payouts</a>
      <a href="plan.html">Plan</a>
      <a href="promotions.html">Promotions</a>
      <a href="settings.html">Settings</a>
    </nav>
  </aside>
  <main class="main">
    <header class="topbar page-shell flex justify-between">
      <h1>Promotions</h1>
      <div class="flex"><div id="notifMount"></div><div id="sessionMount" class="session-control"></div></div>
    </header>
    <div class="page-shell content">
      <div class="section-head"><h2>Performance</h2></div>
      <div class="metric-grid" id="promoStats" style="margin-bottom:var(--space-6)"></div>
      <form class="card" id="promoForm" style="max-width:520px; margin-bottom:var(--space-6)">
        <div class="card-body">
          <h2 class="card-title">Feature a laundromat</h2>
          <p class="text-sm text-muted" id="priceNote">—</p>
          <div class="field">
            <label class="label" for="laundromat_id">Laundromat</label>
            <select class="input" id="laundromat_id" required></select>
          </div>
          <button class="btn btn-primary" type="submit" id="buyBtn">Purchase promotion</button>
        </div>
      </form>
      <div class="section-head"><h2>Your promotions</h2></div>
      <div class="card-grid" id="list"></div>
    </div>
  </main>
  <script src="../js/config.js?v=10"></script>
  <script type="module" src="../js/promotions.js?v=10"></script>
</body>
</html>

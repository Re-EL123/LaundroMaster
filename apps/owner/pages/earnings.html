<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D90429">
  <script>(function(){try{var t=localStorage.getItem('lm_theme');if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#0B0B0D':'#D90429');}catch(e){}})();</script>
  <link rel="icon" href="../../../shared/assets/favicon-32.png?v=14">
  <link rel="apple-touch-icon" href="../../../shared/assets/apple-touch-icon.png?v=14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LaundroMaster">
  <link rel="manifest" href="../manifest.webmanifest">
  <title>Owner Earnings - LaundroMaster</title>
  <link rel="stylesheet" href="../../../shared/css/tokens.css?v=14">
  <link rel="stylesheet" href="../../../shared/css/reset.css?v=14">
  <link rel="stylesheet" href="../../../shared/css/layout.css?v=14">
  <link rel="stylesheet" href="../../../shared/css/buttons.css?v=14">
  <link rel="stylesheet" href="../../../shared/css/cards.css?v=14">
  <link rel="stylesheet" href="../../../shared/css/forms.css?v=14">
  <link rel="stylesheet" href="../../../shared/css/utilities.css?v=14">

</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="../index.html"><img src="../../../shared/assets/app-icon.png?v=14" alt="" width="28" height="28">LM Owner</a>
    <nav class="side-nav">
      <a href="../index.html">Dashboard</a>
      <a href="bookings.html">Bookings</a>
      <a href="services.html">Services</a>
      <a href="earnings.html">Earnings</a>
      <a href="payouts.html">Payouts</a>
      <a href="plan.html">Plan</a>
      <a href="promotions.html">Promotions</a>
      <a href="settings.html">Settings</a>
    </nav>
  </aside>
  <main class="main">
    <header class="topbar page-shell flex justify-between">
      <h1>Earnings</h1>
      <div class="flex"><div id="notifMount"></div><div id="sessionMount" class="session-control"></div></div>
    </header>
    <div class="page-shell content">
      <div class="card-grid" style="margin-bottom:var(--space-6)">
        <article class="card"><div class="card-body"><h2 class="text-sm text-muted">Total earned</h2><p class="stat-value" id="total">—</p></div></article>
        <article class="card"><div class="card-body"><h2 class="text-sm text-muted">Available for payout</h2><p class="stat-value" id="available">—</p></div></article>
        <article class="card"><div class="card-body"><h2 class="text-sm text-muted">Paid out</h2><p class="stat-value" id="paidOut">—</p></div></article>
      </div>
      <div class="section-head"><h2>Net earnings trend</h2><span class="text-sm text-muted">Last 6 months</span></div>
      <div class="card" style="margin-bottom:var(--space-6)"><div class="card-body" id="chart"><p class="text-muted">Loading…</p></div></div>
      <div class="section-head"><h2>Transactions</h2><a class="text-sm" href="payouts.html">Request payout</a></div>
      <div id="txns"></div>
    </div>
  </main>
  <script src="../js/config.js?v=14"></script>
  <script type="module" src="../js/earnings.js?v=14"></script>

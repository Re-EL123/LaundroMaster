<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D90429">
  <link rel="icon" href="../../../shared/assets/favicon-32.png?v=9">
  <link rel="apple-touch-icon" href="../../../shared/assets/apple-touch-icon.png?v=9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LaundroMaster">
  <link rel="manifest" href="../manifest.webmanifest">
  <title>Owner Payouts - LaundroMaster</title>
  <link rel="stylesheet" href="../../../shared/css/tokens.css?v=9">
  <link rel="stylesheet" href="../../../shared/css/reset.css?v=9">
  <link rel="stylesheet" href="../../../shared/css/layout.css?v=9">
  <link rel="stylesheet" href="../../../shared/css/buttons.css?v=9">
  <link rel="stylesheet" href="../../../shared/css/cards.css?v=9">
  <link rel="stylesheet" href="../../../shared/css/forms.css?v=9">
  <link rel="stylesheet" href="../../../shared/css/utilities.css?v=9">
  <link rel="stylesheet" href="../../../shared/css/motion.css?v=9">
  <link rel="stylesheet" href="../css/owner.css?v=9">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="../index.html"><img src="../../../shared/assets/app-icon.png?v=9" alt="" width="28" height="28">LM Owner</a>
    <nav class="side-nav">
      <a href="../index.html">Dashboard</a>
      <a href="bookings.html">Bookings</a>
      <a href="services.html">Services</a>
      <a href="earnings.html">Earnings</a>
      <a href="payouts.html">Payouts</a>
      <a href="plan.html">Plan</a>
      <a href="promotions.html">Promotions</a>
      <a href="settings.html">Settings</a>
    </nav>
  </aside>
  <main class="main">
    <header class="topbar page-shell flex justify-between">
      <h1>Payouts</h1>
      <div class="flex"><div id="notifMount"></div><div id="sessionMount" class="session-control"></div></div>
    </header>
    <div class="page-shell content">
      <div class="card-grid" style="margin-bottom:var(--space-6)">
        <article class="card"><div class="card-body"><h2 class="text-sm text-muted">Available</h2><p class="stat-value" id="available">—</p></div></article>
        <article class="card"><div class="card-body"><h2 class="text-sm text-muted">Total earned</h2><p class="stat-value" id="earned">—</p></div></article>
        <article class="card"><div class="card-body"><h2 class="text-sm text-muted">Paid out</h2><p class="stat-value" id="paidOut">—</p></div></article>
      </div>
      <form class="card" id="payoutForm" style="max-width:520px; margin-bottom:var(--space-6)">
        <div class="card-body">
          <h2 class="card-title">Request a payout</h2>
          <p class="text-sm text-muted" id="minNote">—</p>
          <div class="field">
            <label class="label" for="amount">Amount</label>
            <input class="input" id="amount" type="number" step="0.01" min="0">
          </div>
          <div class="field">
            <label class="label" for="method">Payout method / details</label>
            <input class="input" id="method" placeholder="Bank transfer / account details">
          </div>
          <button class="btn btn-primary" type="submit" id="reqBtn">Request payout</button>
        </div>
      </form>
      <div class="section-head"><h2>History</h2></div>
      <div id="list"></div>
    </div>
  </main>
  <script src="../js/config.js?v=9"></script>
  <script type="module" src="../js/payouts.js?v=9"></script>
</body>
</html>

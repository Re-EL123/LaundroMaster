<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D90429">
  <script>(function(){try{var t=localStorage.getItem('lm_theme');if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#0B0B0D':'#D90429');}catch(e){}})();</script>
  <link rel="icon" href="../../../shared/assets/favicon-32.png?v=10">
  <link rel="apple-touch-icon" href="../../../shared/assets/apple-touch-icon.png?v=10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LaundroMaster">
  <link rel="manifest" href="../manifest.webmanifest">
  <title>Owner Settings - LaundroMaster</title>
  <link rel="stylesheet" href="../../../shared/css/tokens.css?v=10">
  <link rel="stylesheet" href="../../../shared/css/reset.css?v=10">
  <link rel="stylesheet" href="../../../shared/css/layout.css?v=10">
  <link rel="stylesheet" href="../../../shared/css/buttons.css?v=10">
  <link rel="stylesheet" href="../../../shared/css/cards.css?v=10">
  <link rel="stylesheet" href="../../../shared/css/forms.css?v=10">
  <link rel="stylesheet" href="../../../shared/css/utilities.css?v=10">
  <link rel="stylesheet" href="../../../shared/css/motion.css?v=10">
  <link rel="stylesheet" href="../css/owner.css?v=10">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="../index.html"><img src="../../../shared/assets/app-icon.png?v=10" alt="" width="28" height="28">LM Owner</a>
    <nav class="side-nav">
      <a href="../index.html">Dashboard</a>
      <a href="bookings.html">Bookings</a>
      <a href="services.html">Services</a>
      <a href="earnings.html">Earnings</a>
      <a href="payouts.html">Payouts</a>
      <a href="plan.html">Plan</a>
      <a href="promotions.html">Promotions</a>
      <a href="settings.html">Settings</a>
    </nav>
  </aside>
  <main class="main">
    <header class="topbar page-shell flex justify-between">
      <h1>Settings</h1>
      <div class="flex"><div id="notifMount"></div><div id="sessionMount" class="session-control"></div></div>
    </header>
    <div class="page-shell content">
    <div class="page-shell content stack">
      <form class="card" id="profileForm">
        <div class="card-body">
          <h2 class="card-title">Contact details</h2>
          <div class="field">
            <label class="label" for="full_name">Contact name</label>
            <input class="input" id="full_name" name="full_name">
          </div>
          <div class="field">
            <label class="label" for="email">Email</label>
            <input class="input" id="email" disabled>
          </div>
          <div class="field">
            <label class="label" for="phone">Phone</label>
            <input class="input" id="phone" name="phone">
          </div>
          <button class="btn btn-primary" type="submit" id="saveBtn">Save changes</button>
          <p class="form-msg" id="msg" role="status" aria-live="polite"></p>
        </div>
      </form>
      <section class="stack">
        <h2 class="text-sm text-muted">Branding &amp; photos</h2>
        <div id="bizList" class="stack"></div>
      </section>
      <section class="stack" id="teamSection" hidden>
        <h2 class="text-sm text-muted">Team</h2>
        <form class="card" id="inviteForm">
          <div class="card-body">
            <h2 class="card-title">Add a team member</h2>
            <p class="text-muted text-sm">They must already have a LaundroMaster account.</p>
            <div class="field">
              <label class="label" for="inviteBiz">Laundromat</label>
              <select class="input" id="inviteBiz"></select>
            </div>
            <div class="field">
              <label class="label" for="inviteEmail">Email</label>
              <input class="input" id="inviteEmail" type="email" placeholder="name@example.com" required>
            </div>
            <div class="field">
              <label class="label" for="inviteRole">Role</label>
              <select class="input" id="inviteRole">
                <option value="staff">Staff — process orders</option>
                <option value="manager">Manager — full access</option>
              </select>
            </div>
            <button class="btn btn-primary" type="submit" id="inviteBtn">Send invite</button>
            <p class="form-msg" id="teamMsg" role="status" aria-live="polite"></p>
          </div>
        </form>
        <div id="teamList" class="stack"></div>
      </section>
      <section class="stack" id="availabilitySection" hidden>
        <h2 class="text-sm text-muted">Availability &amp; capacity</h2>
        <div id="capacityList" class="stack"></div>
      </section>
    </div>
    </div>
  </main>
  <script src="../js/config.js?v=10"></script>
  <script type="module" src="../js/settings.js?v=10"></script>
</body>
</html>

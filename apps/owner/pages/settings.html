  <meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="../../../shared/css/cards.css?v=8">
  <link rel="stylesheet" href="../../../shared/css/forms.css?v=8">
  <link rel="stylesheet" href="../../../shared/css/utilities.css?v=8">
  <link rel="stylesheet" href="../../../shared/css/motion.css?v=8">
  <link rel="stylesheet" href="../css/owner.css?v=8">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="../index.html"><img src="../../../shared/assets/app-icon.png?v=8" alt="" width="28" height="28">LM Owner</a>
    <nav class="side-nav">
      <a href="../index.html">Dashboard</a>
      <a href="bookings.html">Bookings</a>
      <a href="services.html">Services</a>
      <a href="earnings.html">Earnings</a>
      <a href="payouts.html">Payouts</a>
      <a href="plan.html">Plan</a>
      <a href="promotions.html">Promotions</a>
      <a href="settings.html">Settings</a>
    </nav>
  </aside>
  <main class="main">
    <header class="topbar page-shell flex justify-between">
      <h1>Settings</h1>
      <div class="flex"><div id="notifMount"></div><div id="sessionMount" class="session-control"></div></div>
    </header>
    <div class="page-shell content">
    <div class="page-shell content stack">
      <form class="card" id="profileForm">
        <div class="card-body">
          <h2 class="card-title">Contact details</h2>
          <div class="field">
            <label class="label" for="full_name">Contact name</label>
            <input class="input" id="full_name" name="full_name">
          </div>
          <div class="field">
            <label class="label" for="email">Email</label>
            <input class="input" id="email" disabled>
          </div>
          <div class="field">
            <label class="label" for="phone">Phone</label>
            <input class="input" id="phone" name="phone">
          </div>
          <button class="btn btn-primary" type="submit" id="saveBtn">Save changes</button>
          <p class="form-msg" id="msg" role="status" aria-live="polite"></p>
        </div>
      </form>
      <section class="stack">
        <h2 class="text-sm text-muted">Branding &amp; photos</h2>
        <div id="bizList" class="stack"></div>
      </section>
    </div>
    </div>
  </main>
  <script src="../js/config.js?v=8"></script>
  <script type="module" src="../js/settings.js?v=8"></script>
</body>

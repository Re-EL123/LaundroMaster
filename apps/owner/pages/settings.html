<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Settings - LaundroMaster</title>
  <link rel="stylesheet" href="../../../shared/css/tokens.css?v=3">
  <link rel="stylesheet" href="../../../shared/css/reset.css?v=3">
  <link rel="stylesheet" href="../../../shared/css/layout.css?v=3">
  <link rel="stylesheet" href="../../../shared/css/buttons.css?v=3">
  <link rel="stylesheet" href="../../../shared/css/cards.css?v=3">
  <link rel="stylesheet" href="../../../shared/css/forms.css?v=3">
  <link rel="stylesheet" href="../../../shared/css/utilities.css?v=3">
  <link rel="stylesheet" href="../../../shared/css/motion.css?v=3">
  <link rel="stylesheet" href="../css/owner.css?v=3">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="../index.html">LM Owner</a>
    <nav class="side-nav">
      <a href="../index.html">Dashboard</a>
      <a href="bookings.html">Bookings</a>
      <a href="services.html">Services</a>
      <a href="earnings.html">Earnings</a>
      <a href="settings.html">Settings</a>
    </nav>
  </aside>
  <main class="main">
    <header class="topbar page-shell flex justify-between">
      <h1>Settings</h1>
      <div id="sessionMount" class="session-control"></div>
    </header>
    <div class="page-shell content">
      <div class="layout-split grid">
        <form class="card" id="profileForm">
          <div class="card-body">
            <h2 class="card-title">Business profile</h2>
            <div class="field">
              <label class="label" for="full_name">Contact name</label>
              <input class="input" id="full_name" name="full_name">
            </div>
            <div class="field">
              <label class="label" for="email">Email</label>
              <input class="input" id="email" disabled>
            </div>
            <div class="field">
              <label class="label" for="phone">Phone</label>
              <input class="input" id="phone" name="phone">
            </div>
            <button class="btn btn-primary" type="submit" id="saveBtn">Save changes</button>
            <p class="form-msg" id="msg" role="status" aria-live="polite"></p>
          </div>
        </form>
        <aside class="card">
          <div class="card-body">
            <h2 class="card-title">Your laundromats</h2>
            <div id="bizList"></div>
          </div>
        </aside>
      </div>
    </div>
  </main>
  <script src="../js/config.js?v=3"></script>
  <script type="module" src="../js/settings.js?v=3"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D90429">
  <link rel="icon" href="../../../shared/assets/favicon-32.png?v=9">
  <link rel="apple-touch-icon" href="../../../shared/assets/apple-touch-icon.png?v=9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LaundroMaster">
  <link rel="manifest" href="../manifest.webmanifest">
  <title>Owner Bookings - LaundroMaster</title>
  <link rel="stylesheet" href="../../../shared/css/tokens.css?v=9">
  <link rel="stylesheet" href="../../../shared/css/reset.css?v=9">
  <link rel="stylesheet" href="../../../shared/css/layout.css?v=9">
  <link rel="stylesheet" href="../../../shared/css/buttons.css?v=9">
  <link rel="stylesheet" href="../../../shared/css/cards.css?v=9">
  <link rel="stylesheet" href="../../../shared/css/forms.css?v=9">
  <link rel="stylesheet" href="../../../shared/css/utilities.css?v=9">
  <link rel="stylesheet" href="../../../shared/css/motion.css?v=9">
  <link rel="stylesheet" href="../css/owner.css?v=9">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="../index.html"><img src="../../../shared/assets/app-icon.png?v=9" alt="" width="28" height="28">LM Owner</a>
    <nav class="side-nav">
      <a href="../index.html">Dashboard</a>
      <a href="bookings.html">Bookings</a>
      <a href="services.html">Services</a>
      <a href="earnings.html">Earnings</a>
      <a href="payouts.html">Payouts</a>
      <a href="plan.html">Plan</a>
      <a href="promotions.html">Promotions</a>
      <a href="settings.html">Settings</a>
    </nav>
  </aside>
  <main class="main">
    <header class="topbar page-shell flex justify-between">
      <h1>Bookings</h1>
      <div class="flex"><div id="notifMount"></div><div id="sessionMount" class="session-control"></div></div>
    </header>
    <div class="page-shell content">
      <div class="toolbar">
        <div class="field">
          <label class="label" for="statusFilter">Filter by status</label>
          <select class="select" id="statusFilter">
            <option value="">All</option>
            <option value="pending_acceptance">Awaiting acceptance</option>
            <option value="accepted">Accepted</option>
            <option value="collected">Collected</option>
            <option value="washing">Washing</option>
            <option value="drying">Drying</option>
            <option value="ironing">Ironing</option>
            <option value="ready">Ready</option>
            <option value="out_for_delivery">Out for delivery</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <button class="btn btn-secondary" type="button" id="acceptAllBtn">Accept all pending</button>
        <span class="text-sm text-muted" id="slaNote"></span>
      </div>
      <div class="card-grid" id="list"></div>
    </div>
  </main>
  <script src="../js/config.js?v=9"></script>
  <script type="module" src="../js/bookings.js?v=9"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D90429">
  <script>(function(){try{var t=localStorage.getItem('lm_theme');if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#0B0B0D':'#D90429');}catch(e){}})();</script>
  <link rel="icon" href="../../../shared/assets/favicon-32.png?v=12">
  <link rel="apple-touch-icon" href="../../../shared/assets/apple-touch-icon.png?v=12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LaundroMaster">
  <link rel="manifest" href="../manifest.webmanifest">
  <title>Owner Services - LaundroMaster</title>
  <link rel="stylesheet" href="../../../shared/css/tokens.css?v=12">
  <link rel="stylesheet" href="../../../shared/css/reset.css?v=12">
  <link rel="stylesheet" href="../../../shared/css/layout.css?v=12">
  <link rel="stylesheet" href="../../../shared/css/buttons.css?v=12">
  <link rel="stylesheet" href="../../../shared/css/cards.css?v=12">
  <link rel="stylesheet" href="../../../shared/css/forms.css?v=12">
  <link rel="stylesheet" href="../../../shared/css/utilities.css?v=12">
  <link rel="stylesheet" href="../../../shared/css/motion.css?v=12">
  <link rel="stylesheet" href="../css/owner.css?v=12">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="../index.html"><img src="../../../shared/assets/app-icon.png?v=12" alt="" width="28" height="28">LM Owner</a>
    <nav class="side-nav">
      <a href="../index.html">Dashboard</a>
      <a href="bookings.html">Bookings</a>
      <a href="services.html">Services</a>
      <a href="earnings.html">Earnings</a>
      <a href="payouts.html">Payouts</a>
      <a href="plan.html">Plan</a>
      <a href="promotions.html">Promotions</a>
      <a href="settings.html">Settings</a>
    </nav>
  </aside>
  <main class="main">
    <header class="topbar page-shell flex justify-between">
      <h1>Services</h1>
      <div class="flex"><div id="notifMount"></div><div id="sessionMount" class="session-control"></div></div>
    </header>
    <div class="page-shell content">
      <div class="layout-split grid">
        <section>
          <h2 class="section-head">Your services</h2>
          <div class="card-grid" id="list"></div>
        </section>
        <aside class="card">
          <div class="card-body">
            <h2 class="card-title">Add a service</h2>
            <form id="serviceForm" class="grid">
              <div class="field">
                <label class="label" for="laundromat_id">Laundromat</label>
                <select class="select" id="laundromat_id" name="laundromat_id" required></select>
              </div>
              <div class="field">
                <label class="label" for="name">Name</label>
                <input class="input" id="name" name="name" required minlength="2">
              </div>
              <div class="field">
                <label class="label" for="description">Description</label>
                <textarea class="textarea" id="description" name="description" rows="2"></textarea>
              </div>
              <div class="field">
                <label class="label">Photo</label>
                <div class="flex branding-head">
                  <img class="branding-logo" id="serviceImagePreview" alt="">
                  <input type="file" id="serviceImageInput" accept="image/*" hidden>
                  <button type="button" class="btn btn-secondary" id="serviceImageBtn">Add photo</button>
                </div>
              </div>
              <div class="field">
                <label class="label" for="base_price">Price (ZAR)</label>
                <input class="input" id="base_price" name="base_price" type="number" min="0" step="0.01" required>
                <p class="help" id="netCalc">You keep 100% of each order after commission.</p>
              </div>
              <div class="field">
                <label class="label" for="turnaround_hours">Turnaround (hours)</label>
                <input class="input" id="turnaround_hours" name="turnaround_hours" type="number" min="0" value="24">
              </div>
              <button class="btn btn-primary" type="submit" id="saveBtn">Add service</button>
              <p class="form-msg" id="msg" role="status" aria-live="polite"></p>
            </form>
          </div>
        </aside>
      </div>
    </div>
  </main>
  <script src="../js/config.js?v=12"></script>
  <script type="module" src="../js/services.js?v=12"></script>
</body>
</html>

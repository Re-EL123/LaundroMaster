<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Services - LaundroMaster</title>
  <link rel="stylesheet" href="../../../shared/css/tokens.css">
  <link rel="stylesheet" href="../../../shared/css/reset.css">
  <link rel="stylesheet" href="../../../shared/css/layout.css">
  <link rel="stylesheet" href="../../../shared/css/buttons.css">
  <link rel="stylesheet" href="../../../shared/css/cards.css">
  <link rel="stylesheet" href="../../../shared/css/forms.css">
  <link rel="stylesheet" href="../../../shared/css/utilities.css">
  <link rel="stylesheet" href="../../../shared/css/motion.css">
  <link rel="stylesheet" href="../css/owner.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="../index.html">LM Owner</a>
    <nav class="side-nav">
      <a href="../index.html">Dashboard</a>
      <a href="bookings.html">Bookings</a>
      <a href="services.html">Services</a>
      <a href="earnings.html">Earnings</a>
      <a href="settings.html">Settings</a>
    </nav>
  </aside>
  <main class="main">
    <header class="topbar page-shell flex justify-between">
      <h1>Services</h1>
      <div id="sessionMount" class="session-control"></div>
    </header>
    <div class="page-shell content">
      <div class="layout-split grid">
        <section>
          <h2 class="section-head">Your services</h2>
          <div class="card-grid" id="list"></div>
        </section>
        <aside class="card">
          <div class="card-body">
            <h2 class="card-title">Add a service</h2>
            <form id="serviceForm" class="grid">
              <div class="field">
                <label class="label" for="laundromat_id">Laundromat</label>
                <select class="select" id="laundromat_id" name="laundromat_id" required></select>
              </div>
              <div class="field">
                <label class="label" for="name">Name</label>
                <input class="input" id="name" name="name" required minlength="2">
              </div>
              <div class="field">
                <label class="label" for="description">Description</label>
                <textarea class="textarea" id="description" name="description" rows="2"></textarea>
              </div>
              <div class="field">
                <label class="label" for="base_price">Price (ZAR)</label>
                <input class="input" id="base_price" name="base_price" type="number" min="0" step="0.01" required>
              </div>
              <div class="field">
                <label class="label" for="turnaround_hours">Turnaround (hours)</label>
                <input class="input" id="turnaround_hours" name="turnaround_hours" type="number" min="0" value="24">
              </div>
              <button class="btn btn-primary" type="submit" id="saveBtn">Add service</button>
              <p class="form-msg" id="msg" role="status" aria-live="polite"></p>
            </form>
          </div>
        </aside>
      </div>
    </div>
  </main>
  <script src="../js/config.js"></script>
  <script type="module" src="../js/services.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D90429">
  <script>(function(){try{var t=localStorage.getItem('lm_theme');if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#0B0B0D':'#D90429');}catch(e){}})();</script>
  <link rel="icon" href="../../../shared/assets/favicon-32.png?v=11">
  <link rel="apple-touch-icon" href="../../../shared/assets/apple-touch-icon.png?v=11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LaundroMaster">
  <link rel="manifest" href="../manifest.webmanifest">
  <title>Admin Audit - LaundroMaster</title>
  <link rel="stylesheet" href="../../../shared/css/tokens.css?v=11">
  <link rel="stylesheet" href="../../../shared/css/reset.css?v=11">
  <link rel="stylesheet" href="../../../shared/css/layout.css?v=11">
  <link rel="stylesheet" href="../../../shared/css/buttons.css?v=11">
  <link rel="stylesheet" href="../../../shared/css/cards.css?v=11">
  <link rel="stylesheet" href="../../../shared/css/forms.css?v=11">
  <link rel="stylesheet" href="../../../shared/css/utilities.css?v=11">
  <link rel="stylesheet" href="../../../shared/css/motion.css?v=11">
  <link rel="stylesheet" href="../css/admin.css?v=11">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="../index.html"><img src="../../../shared/assets/app-icon.png?v=11" alt="" width="28" height="28">LM Admin</a>
    <nav class="side-nav">
      <a href="../index.html">Dashboard</a>
      <a href="laundromats.html">Laundromats</a>
      <a href="verifications.html">Verifications</a>
      <a href="users.html">Users</a>
      <a href="plans.html">Plans</a>
      <a href="commissions.html">Commissions</a>
      <a href="payouts.html">Payouts</a>
      <a href="payments.html">Payments</a>
      <a href="promotions.html">Promotions</a>
      <a href="refunds.html">Refunds</a>
      <a href="settings.html">Settings</a>
      <a href="audit.html">Audit</a>
    </nav>
  </aside>
  <main class="main">
    <header class="topbar page-shell flex justify-between">
      <h1>Audit log</h1>
      <div id="sessionMount" class="session-control"></div>
      <div id="notifMount" class="session-control"></div>
    </header>
    <div class="page-shell content">
      <form id="filters" class="flex" style="gap:var(--space-2);flex-wrap:wrap;margin-bottom:var(--space-4)">
        <input class="input" id="f_q" placeholder="Search action" style="max-width:16rem">
        <input class="input" id="f_actor" placeholder="Actor user id" style="max-width:16rem">
        <select class="input" id="f_target" style="max-width:12rem">
          <option value="">All targets</option>
          <option value="laundromat">Laundromat</option>
          <option value="user">User</option>
          <option value="payout">Payout</option>
          <option value="refund">Refund</option>
          <option value="promotion">Promotion</option>
          <option value="platform">Platform</option>
        </select>
        <button class="btn btn-primary" type="submit">Filter</button>
        <button class="btn btn-secondary" type="button" id="clearFilters">Clear</button>
      </form>
      <div id="list"></div>
    </div>
  </main>
  <script src="../js/config.js?v=11"></script>
  <script type="module" src="../js/audit.js?v=11"></script>
</body>
</html>
